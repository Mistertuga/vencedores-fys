<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anúncios ForYouSong</title>
<style>
  :root {
    --fundo: #f6f2ee; --cartao: #ffffff; --linha: #e8dfd6; --linha-fina: #f0e9e2; --texto: #2b2624; --suave: #776c66;
    --ameixa: #e8622c; --ameixa-escuro: #c94f1f; --ameixa-claro: #fff0e8;
    --verde: #3f6b4c; --verde-claro: #e6efe8; --areia: #7a6235; --areia-claro: #f4ecdc;
    --azul: #3d5d7d; --azul-claro: #e7eef5; --rosa: #8a4f4f; --rosa-claro: #f5e7e5; --cinza-claro: #efebe7;
    --gutter: 32px; --largura: 1840px; --margem: max(var(--gutter), (100% - var(--largura)) / 2);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  button { font: inherit; color: inherit; }

  .hero { margin: 24px var(--margem) 0; padding: 28px 30px 24px; border-radius: 20px; color: #fff;
          background: linear-gradient(135deg, #d9561f 0%, #FD703A 55%, #fda27a 100%); }
  .hero h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; }
  .hero p { margin: 8px 0 0; color: rgba(255,255,255,.88); max-width: 60em; text-wrap: pretty; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); padding: 6px 12px; border-radius: 10px; font-size: 13.5px; }
  .chip b { font-weight: 700; }

  .passos { margin: 18px var(--margem) 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .passo { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--suave); }
  .passo b { display: block; font-size: 14.5px; color: var(--texto); margin-bottom: 2px; }

  .filtros { margin: 20px var(--margem) 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .grupo { display: flex; flex-wrap: wrap; gap: 6px; }
  .f { border: 1px solid var(--linha); background: var(--cartao); border-radius: 10px; padding: 7px 12px; font-size: 13.5px; cursor: pointer; }
  .f small { color: var(--suave); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .f.ativo { background: var(--texto); border-color: var(--texto); color: #fff; }
  .f.ativo small { color: rgba(255,255,255,.7); }
  .so { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--suave); cursor: pointer; }
  .so input { width: 16px; height: 16px; accent-color: var(--ameixa); }

  .aviso { margin: 16px var(--margem) 0; padding: 12px 16px; border-radius: 12px; background: var(--areia-claro); color: var(--areia); font-size: 13.5px; }

  main { margin: 18px var(--margem) 0; padding-bottom: 56px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1500px) { main { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1180px) { main { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 880px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 1px 2px rgba(60,40,50,.04), 0 10px 26px -18px rgba(60,40,50,.18); }
  .cartao.vencedor { border: 2px solid #c9a75a; }
  .topo { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
  .codigo { padding: 0 12px 8px; font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .codigo b { color: var(--texto); font-size: 14px; margin-right: 4px; }
  .selo { font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .selo.vencedor { background: #f6ecd2; color: #7a5a17; } .selo.promissor { background: var(--verde-claro); color: var(--verde); }
  .selo.teste { background: var(--azul-claro); color: var(--azul); } .selo.fraco, .selo.fora { background: var(--rosa-claro); color: var(--rosa); }
  .quem { font-size: 12.5px; color: var(--suave); line-height: 1.3; min-width: 0; }
  .quem b { display: block; color: var(--texto); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quem span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligado { margin-left: auto; font-size: 12px; color: var(--suave); white-space: nowrap; }
  .ligado.on { color: var(--verde); font-weight: 600; }

  /* cartão em coluna: 5 por fila no computador */
  .video { padding: 0 12px; }
  .video video { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; background: #2a2226; }
  .grandes { display: grid; grid-template-columns: repeat(3, 1fr); margin: 10px 12px 0; border: 1px solid var(--linha-fina); border-radius: 10px; overflow: hidden; }
  .grande { padding: 7px 9px; text-align: center; }
  .grande.zero b { color: var(--suave); font-weight: 500; }
  .cartao { transition: box-shadow .15s, transform .15s; }
  .cartao:hover { box-shadow: 0 6px 20px rgba(40,30,20,.08); transform: translateY(-1px); }
  .grande + .grande { border-left: 1px solid var(--linha-fina); }
  .grande small { display: block; font-size: 11px; color: var(--suave); }
  .grande b { font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .pequenos { display: grid; grid-template-columns: repeat(4, 1fr); margin: 8px 12px 10px; font-variant-numeric: tabular-nums; }
  .pequenos span { font-size: 10.5px; color: var(--suave); padding: 4px 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pequenos b { display: block; font-size: 12.5px; color: var(--texto); font-weight: 600; }
  .porque { margin: 0 12px 10px; padding: 7px 10px; border-radius: 9px; font-size: 12px; line-height: 1.4; background: var(--cinza-claro); min-height: 3.3em; }
  .vencedor .porque { background: #faf3e2; } .promissor .porque { background: var(--verde-claro); }
  .acoes { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; padding: 0 12px 12px; }
  .acoes a, .acoes button { display: flex; align-items: center; justify-content: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 9px;
            border: 1px solid var(--linha); background: var(--cartao); font-size: 12.5px; text-decoration: none; color: var(--texto); cursor: pointer; white-space: nowrap; }
  .acoes a:hover, .acoes button:hover { background: var(--fundo); }
  .acoes .principal { background: var(--ameixa); border-color: var(--ameixa); color: #fff; }
  .acoes .principal:hover { background: var(--ameixa-escuro); }

  .mais { border-top: 1px solid var(--linha-fina); }
  .mais details + details { border-top: 1px solid var(--linha-fina); }
  .mais summary { padding: 9px 12px; font-size: 12.5px; cursor: pointer; list-style: none; }
  .mais summary::-webkit-details-marker { display: none; }
  .mais summary::after { content: "›"; float: right; color: var(--suave); }
  .mais details[open] summary::after { content: "⌄"; }
  .mais p { margin: 0 12px 12px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; color: var(--texto); }
  .mais p.s { color: var(--suave); }

  .vazio { grid-column: 1 / -1; text-align: center; color: var(--suave); padding: 48px 16px; background: var(--cartao); border: 1px dashed var(--linha); border-radius: 16px; }
  .vazio b { display: block; color: var(--texto); font-size: 17px; margin-bottom: 4px; }
  footer { margin: 0 var(--margem); padding: 18px 0 48px; border-top: 1px solid var(--linha); color: var(--suave); font-size: 12.5px; line-height: 1.6; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--texto); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.ver { opacity: 1; }

  @media (max-width: 820px) { .passos { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    .hero { margin: 16px 16px 0; padding: 22px 18px; } .hero h1 { font-size: 24px; }
    .so { margin-left: 0; }
    main { grid-template-columns: 1fr; }

  }
  /* três botões, cada um com a cor da sua plataforma */
  .plats { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .plats button { display: flex; align-items: center; gap: 8px; border: 2px solid transparent; color: #fff; font-size: 15px; font-weight: 650;
                  padding: 11px 20px; border-radius: 12px; cursor: pointer; opacity: .7; transition: opacity .15s, transform .15s; }
  .plats button:hover { opacity: .85; }
  .plats button.ativo { opacity: 1; box-shadow: 0 0 0 3px #fff, 0 0 0 5px currentColor; }
  .plats [data-p=meta] { background: #1877f2; } .plats [data-p=meta].ativo { color: #fff; box-shadow: 0 0 0 3px var(--cartao), 0 0 0 5px #1877f2; }
  .plats [data-p=google] { background: #fbbc04; color: #2b2205; } .plats [data-p=google].ativo { box-shadow: 0 0 0 3px var(--cartao), 0 0 0 5px #fbbc04; }
  .plats [data-p=tiktok] { background: #111; } .plats [data-p=tiktok].ativo { box-shadow: 0 0 0 3px var(--cartao), 0 0 0 5px #111; }
  .vazio-plat { margin: 18px var(--margem) 56px; padding: 56px 24px; text-align: center; background: var(--cartao); border: 1px dashed var(--linha); border-radius: 16px; color: var(--suave); }
  .vazio-plat b { display: block; font-size: 19px; color: var(--texto); margin-bottom: 6px; }
  /* topo claro, para os três botões se verem nas suas cores */
  .hero, .hero.meta, .hero.google, .hero.tiktok { background: var(--cartao); color: var(--texto); border: 1px solid var(--linha); box-shadow: none; }
  .hero p { color: var(--suave) !important; }
  .hero .chip { background: var(--fundo); border-color: var(--linha); color: var(--texto); }
</style>
</head>
<body>
<header class="hero">
  <div class="plats" id="plats">
    <button data-p="meta">📘 Facebook Meta Ads</button><button data-p="google">🔎 Google Ads</button><button data-p="tiktok">🎵 TikTok Ads</button>
  </div>
  <h1 id="titulo">📣 Anúncios ativos ForYouSong</h1>
  <p id="desc">Os anúncios que temos a correr no Facebook e como está a correr cada um. Quando um passa a vencedor, fica pronto para meter no Google e no TikTok Shop, com o vídeo e o texto prontos a levar.</p>
  <div class="chips" id="chips"></div>
</header>

<section class="vazio-plat" id="vazio-plat" hidden></section>

<div class="filtros">
  <div class="grupo" id="f-veredito"></div>
  <div class="grupo" id="f-mercado"></div>
  <label class="so"><input type="checkbox" id="so-ligados"> Só os que estão a correr</label>
</div>
<div class="aviso" id="aviso" hidden></div>
<main id="lista"></main>
<footer id="rodape"></footer>
<div class="toast" id="toast"></div>

<script>document.write('<script src="dados-vencedores-fys.js?' + Date.now() + '"><\/script>');</script>
<script>
  const D = window.VENCEDORES_FYS || { itens: [], lido: "-" };
  const WEB = !!window.VENCEDORES_WEB; // no link partilhado os vídeos estão em videos/<código>.mp4
  const nf = (x, c = 0) => x == null ? "-" : new Intl.NumberFormat("pt-PT", { minimumFractionDigits: c, maximumFractionDigits: c }).format(x);
  const eur = (x, c = 2) => x == null ? "-" : nf(x, c) + " €";
  const pct = (x) => x == null ? "-" : nf(x, 1) + "%";
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const VER = {
    vencedor: { emo: "🏆", nome: "Vencedor" }, promissor: { emo: "🌱", nome: "Promissor" },
    teste: { emo: "⏳", nome: "Em teste" }, fraco: { emo: "❌", nome: "Não copiar" }, fora: { emo: "🚫", nome: "Rejeitado" },
  };
  const est = { v: "todos", m: "todos", so: true };
  try { Object.assign(est, JSON.parse(localStorage.getItem("anuncios-fys") || "{}")); } catch (e) {}
  const guarda = () => { try { localStorage.setItem("anuncios-fys", JSON.stringify(est)); } catch (e) {} };

  const video = (f) => WEB ? `videos/${encodeURIComponent(f.codigo)}.mp4` : encodeURI(f.video_local);
  const data = (s) => s && s.length >= 10 ? s.slice(8, 10) + "/" + s.slice(5, 7) + " às " + s.slice(11, 16) : s;

  // totais do topo
  (() => {
    const I = D.itens, g = I.reduce((a, f) => a + f.gasto, 0), c = I.reduce((a, f) => a + f.compras, 0), v = I.reduce((a, f) => a + f.valor, 0);
    const venc = I.filter((f) => f.veredito === "vencedor").length;
    document.getElementById("chips").innerHTML = [
      ["🏆", venc, venc === 1 ? "vencedor" : "vencedores"], ["🟢", I.filter((f) => f.ligado).length, "ligados"],
      ["💶", eur(g), "gastos"], ["🛒", nf(c), "compras"], ["📈", g ? nf(v / g, 2) : "-", "ROAS"], ["🕒", data(D.lido), ""],
    ].map(([e, n, t]) => `<span class="chip">${e} <b>${n}</b> ${t}</span>`).join("");
    document.getElementById("rodape").innerHTML =
      `Números do Gestor de Anúncios da Meta (conta Holy Song LLC), desde que cada anúncio foi criado, lidos a ${data(D.lido)}. ` +
      `Hook = quem viu 3 s a dividir pelas impressões. Hold = quem viu até ao fim (ou 15 s) a dividir por quem viu 3 s. ` +
      `No Google e no TikTok Shop o link vai para a mesma página do país: copia-o pelo botão «Página».`;
  })();

  function filtros() {
    const I = D.itens.filter((f) => !est.so || f.ligado);
    const conta = (fn) => I.filter(fn).length;
    const vs = [["todos", "Todos", I.length], ...["vencedor", "promissor", "teste", "fraco"].map((k) => [k, VER[k].emo + " " + VER[k].nome, conta((f) => f.veredito === k || (k === "fraco" && f.veredito === "fora"))])];
    document.getElementById("f-veredito").innerHTML = vs.map(([k, n, c]) => `<button class="f ${est.v === k ? "ativo" : ""}" data-v="${k}">${n}<small>${c}</small></button>`).join("");
    const ms = [...new Set(D.itens.map((f) => f.mercado))];
    document.getElementById("f-mercado").innerHTML = [["todos", "🌍 Todos"], ...ms.map((m) => { const f = D.itens.find((x) => x.mercado === m); return [m, f.bandeira + " " + f.pais]; })]
      .map(([k, n]) => `<button class="f ${est.m === k ? "ativo" : ""}" data-m="${k}">${n}<small>${k === "todos" ? I.length : conta((f) => f.mercado === k)}</small></button>`).join("");
    document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { est.v = b.dataset.v; guarda(); desenha(); });
    document.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { est.m = b.dataset.m; guarda(); desenha(); });
  }

  function cartao(f) {
    const V = VER[f.veredito];
    return `<article class="cartao ${f.veredito}">
      <div class="topo"><span class="selo ${f.veredito}">${V.emo} ${V.nome}</span>
        <span class="ligado ${f.ligado ? "on" : ""}">${f.ligado ? "● Ligado" : f.estado === "DISAPPROVED" ? "Rejeitado" : "Em pausa"}</span></div>
      <div class="codigo"><b>${f.bandeira} ${esc(f.codigo)}</b>${esc(f.concorrente || "")} · ${esc(f.conjunto.replace("AdSet - ", ""))}</div>
      <div class="video"><video playsinline preload="none" data-src="${video(f)}#t=0.1"></video></div>
      <div class="grandes">
        <div class="grande"><small>Gasto</small><b>${eur(f.gasto)}</b></div>
        <div class="grande${f.compras ? "" : " zero"}"><small>Compras</small><b>${nf(f.compras)}</b></div>
        <div class="grande${f.roas ? "" : " zero"}"><small>ROAS</small><b>${f.gasto ? nf(f.roas, 2) : "-"}</b></div>
      </div>
      <div class="pequenos">
        <span>Hook<b>${pct(f.hook)}</b></span><span>Hold<b>${pct(f.hold)}</b></span>
        <span>CTR<b>${f.ctr == null ? "-" : nf(f.ctr, 2) + "%"}</b></span><span>CPM<b>${eur(f.cpm)}</b></span>
        <span>Visitas<b>${nf(f.visitas)}</b></span><span>Carrinhos<b>${nf(f.carrinhos)}</b></span>
        <span>Por compra<b>${eur(f.cpa)}</b></span><span>Vendas<b>${eur(f.valor)}</b></span>
      </div>
      <div class="porque">${esc(f.porque)}</div>
      <div class="acoes">
        <a class="principal" href="${video(f)}" download="${esc(f.codigo)}.mp4">⬇️ Vídeo</a>
        <button data-copia="texto" data-id="${f.id}" title="Copiar o texto do anúncio">📋 Texto</button>
        <button data-copia="titulo" data-id="${f.id}" title="Copiar o título">🏷️ Título</button>
        <button data-copia="link" data-id="${f.id}" title="Copiar o link da página">🔗</button>
      </div>
      <div class="mais">
        <details><summary>Texto do anúncio</summary><p><b>${esc(f.titulo)}</b>\n\n${esc(f.texto)}</p></details>
        ${f.prova ? `<details><summary>De onde veio (concorrência)</summary><p class="s">${esc(f.concorrente)} · ${esc(f.prova)}${f.gancho_txt ? "\n\nGancho: " + esc(f.gancho_txt) : ""}</p></details>` : ""}
      </div>
    </article>`;
  }

  // os vídeos só carregam quando chegam perto do ecrã
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return; const v = e.target; io.unobserve(v); v.src = v.dataset.src; v.preload = "metadata";
  }), { rootMargin: "500px 0px" });

  function desenha() {
    document.getElementById("so-ligados").checked = est.so;
    filtros();
    const I = D.itens.filter((f) => (!est.so || f.ligado) && (est.m === "todos" || f.mercado === est.m) &&
      (est.v === "todos" || f.veredito === est.v || (est.v === "fraco" && f.veredito === "fora")));
    const venc = D.itens.filter((f) => f.veredito === "vencedor").length;
    const aviso = document.getElementById("aviso");
    aviso.hidden = venc > 0;
    aviso.textContent = "Ainda nenhum anúncio passou a vencedor: estão no ar há pouco tempo. Esta página atualiza-se sozinha a cada 30 minutos.";
    document.getElementById("lista").innerHTML = I.length ? I.map(cartao).join("")
      : `<div class="vazio"><b>Nada aqui por agora</b>${est.v === "vencedor" ? "Quando um anúncio tiver 3 compras com ROAS de 2 ou mais, aparece aqui." : "Experimenta outro filtro."}</div>`;
    document.querySelectorAll("video[data-src]").forEach((v) => {
      io.observe(v);
      v.onmouseenter = () => { v.controls = true; };
      v.onmouseleave = () => { if (v.paused) v.controls = false; };
      v.onclick = () => { if (!v.controls) { v.controls = true; v.play(); } };
    });
    document.querySelectorAll("[data-copia]").forEach((b) => b.onclick = () => {
      const f = D.itens.find((x) => x.id === b.dataset.id);
      const t = b.dataset.copia === "texto" ? f.texto : b.dataset.copia === "titulo" ? f.titulo : f.link;
      copia(t, b.dataset.copia === "link" ? "Link da página copiado" : "Copiado");
    });
  }
  function copia(t, msg) {
    const fim = () => { const e = document.getElementById("toast"); e.textContent = msg; e.classList.add("ver"); setTimeout(() => e.classList.remove("ver"), 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(fim, () => velho(t, fim)); else velho(t, fim);
  }
  function velho(t, fim) { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); fim(); }
  // três plataformas: só a Meta tem números ligados por agora
  const PLAT = {
    meta: { t: "📘 Facebook Meta Ads", d: "Os anúncios que temos a correr no Facebook e Instagram e como está a correr cada um. Quando um passa a vencedor, fica pronto para meter no Google e no TikTok, com o vídeo e o texto prontos a levar." },
    google: { t: "🔎 Google Ads", d: "Os anúncios que a equipa do Google tem a correr." },
    tiktok: { t: "🎵 TikTok Ads", d: "Os anúncios que a equipa do TikTok tem a correr." },
  };
  let plat = "meta";
  try { plat = localStorage.getItem("anuncios-fys-plat") || "meta"; } catch (e) {}
  function mostraPlat() {
    if (!PLAT[plat]) plat = "meta";
    document.querySelectorAll("#plats button").forEach((b) => b.classList.toggle("ativo", b.dataset.p === plat));
    document.querySelector(".hero").className = "hero " + plat;
    document.getElementById("titulo").textContent = PLAT[plat].t;
    document.getElementById("desc").textContent = PLAT[plat].d;
    const meta = plat === "meta";
    for (const sel of ["#chips", ".filtros", "#lista", "#rodape"]) document.querySelector(sel).hidden = !meta;
    document.getElementById("aviso").hidden = !meta || D.itens.some((f) => f.veredito === "vencedor");
    const v = document.getElementById("vazio-plat");
    v.hidden = meta;
    v.innerHTML = `<b>${PLAT[plat].t}: ainda sem números</b>Esta parte ainda não está ligada à conta. Quando estiver, os anúncios aparecem aqui como os da Meta.`;
  }
  document.querySelectorAll("#plats button").forEach((b) => b.onclick = () => { plat = b.dataset.p; try { localStorage.setItem("anuncios-fys-plat", plat); } catch (e) {} mostraPlat(); });
  document.getElementById("so-ligados").onchange = (e) => { est.so = e.target.checked; guarda(); desenha(); };
  desenha();
  mostraPlat();
</script>
</body>
</html>
