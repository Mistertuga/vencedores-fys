<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anúncios ForYouSong</title>
<style>
  :root {
    --fundo: #f6f2ee; --cartao: #ffffff; --linha: #e8dfd6; --linha-fina: #f0e9e2; --texto: #2b2624; --suave: #776c66;
    --ameixa: #e8622c; --ameixa-escuro: #c94f1f; --ameixa-claro: #fff0e8;
    --verde: #3f6b4c; --verde-claro: #e6efe8; --areia: #7a6235; --areia-claro: #f4ecdc;
    --azul: #3d5d7d; --azul-claro: #e7eef5; --rosa: #8a4f4f; --rosa-claro: #f5e7e5; --cinza-claro: #efebe7;
    --gutter: 32px; --largura: 1840px; --margem: max(var(--gutter), (100% - var(--largura)) / 2);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  button { font: inherit; color: inherit; }

  .hero { margin: 24px var(--margem) 0; padding: 28px 30px 24px; border-radius: 20px; color: #fff;
          background: linear-gradient(135deg, #d9561f 0%, #FD703A 55%, #fda27a 100%); }
  .hero h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; }
  .hero p { margin: 8px 0 0; color: rgba(255,255,255,.88); max-width: 60em; text-wrap: pretty; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); padding: 6px 12px; border-radius: 10px; font-size: 13.5px; }
  .chip b { font-weight: 700; }

  .passos { margin: 18px var(--margem) 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .passo { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--suave); }
  .passo b { display: block; font-size: 14.5px; color: var(--texto); margin-bottom: 2px; }

  .rotulo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); margin-right: -10px; }
  .filtros { margin: 20px var(--margem) 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .grupo { display: flex; flex-wrap: wrap; gap: 6px; }
  .f { border: 1px solid var(--linha); background: var(--cartao); border-radius: 10px; padding: 7px 12px; font-size: 13.5px; cursor: pointer; }
  .f small { color: var(--suave); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .f.ativo { background: var(--texto); border-color: var(--texto); color: #fff; }
  .f.ativo small { color: rgba(255,255,255,.7); }
  .so { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--suave); cursor: pointer; }
  .so input { width: 16px; height: 16px; accent-color: var(--ameixa); }

  .aviso { margin: 16px var(--margem) 0; padding: 12px 16px; border-radius: 12px; background: var(--areia-claro); color: var(--areia); font-size: 13.5px; }

  main { margin: 18px var(--margem) 0; padding-bottom: 56px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1500px) { main { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1180px) { main { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 880px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 1px 2px rgba(60,40,50,.04), 0 10px 26px -18px rgba(60,40,50,.18); }
  .cartao.vencedor { border: 2px solid #c9a75a; }
  .topo { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
  .codigo { padding: 0 12px 8px; font-size: 12px; color: var(--suave); line-height: 1.8; }
  .codigo b { color: var(--texto); font-size: 14px; margin-right: 4px; }
  .selo { font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .selo.vencedor { background: #f6ecd2; color: #7a5a17; } .selo.promissor { background: var(--verde-claro); color: var(--verde); }
  .selo.teste { background: var(--azul-claro); color: var(--azul); } .selo.fraco, .selo.fora { background: var(--rosa-claro); color: var(--rosa); }
  .quem { font-size: 12.5px; color: var(--suave); line-height: 1.3; min-width: 0; }
  .quem b { display: block; color: var(--texto); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quem span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligado { margin-left: auto; font-size: 12px; color: var(--suave); white-space: nowrap; }
  .ligado.on { color: var(--verde); font-weight: 600; }

  /* cartão em coluna: 5 por fila no computador */
  .video { padding: 0 12px; }
  .conc-gasto { font-size: 12px; font-weight: 700; color: #8a3a12; background: #fdf0e6; border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
  .campanhas { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; margin: 18px var(--margem) 0; }
  .campanhas:empty { display: none; }
  .camp { background: #fff; border: 1px solid #e8e1d6; border-radius: 14px; padding: 14px 16px 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .camp:hover { border-color: #d6cbbb; }
  .camp.ativa { border-color: #2b2723; box-shadow: 0 0 0 1px #2b2723; }
  .camp .cab { display: flex; align-items: center; gap: 8px; }
  .camp .cab b { font-size: 15px; }
  .camp .cab small { margin-left: auto; font-size: 12px; font-weight: 600; color: #2e7d4f; white-space: nowrap; }
  .camp .cab small.off { color: #8a8178; }
  .camp .tipo { font-size: 12px; color: #8a8178; margin: 1px 0 10px; }
  .camp .gasto { display: flex; align-items: baseline; gap: 6px; }
  .camp .gasto b { font-size: 22px; font-weight: 600; letter-spacing: -.3px; }
  .camp .gasto span { font-size: 12.5px; color: #8a8178; }
  .camp .barra { height: 4px; background: #f1ebe2; border-radius: 2px; margin: 8px 0 10px; overflow: hidden; }
  .camp .barra i { display: block; height: 100%; background: #2b2723; border-radius: 2px; }
  .camp .rodape { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12.5px; color: #8a8178; }
  .camp .rodape span { white-space: nowrap; }
  .camp .rodape b { color: #2b2723; font-weight: 600; }
  .camp .rodape b.bom { color: #2e7d4f; }
  .winner { display: inline-block; margin-right: 8px; padding: 2px 9px; border-radius: 7px; background: #2b2723; color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .3px; vertical-align: 1px; }
  .marca-agua { margin: 0 12px 8px; padding: 7px 10px; border-radius: 8px; background: #fdecea; color: #a12a1f; border: 1px solid #f3c2bc; font-size: 12.5px; }
  .video video { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; background: #2a2226; }
  .grandes { display: grid; grid-template-columns: repeat(3, 1fr); margin: 10px 12px 0; border: 1px solid var(--linha-fina); border-radius: 10px; overflow: hidden; }
  .grande { padding: 7px 9px; text-align: center; }
  .grande.zero b { color: var(--suave); font-weight: 500; }
  .cartao { transition: box-shadow .15s, transform .15s; }
  .cartao:hover { box-shadow: 0 6px 20px rgba(40,30,20,.08); transform: translateY(-1px); }
  .grande + .grande { border-left: 1px solid var(--linha-fina); }
  .grande small { display: block; font-size: 11px; color: var(--suave); }
  .grande b { font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .pequenos { display: grid; grid-template-columns: repeat(4, 1fr); margin: 8px 12px 10px; font-variant-numeric: tabular-nums; }
  .pequenos span { font-size: 10.5px; color: var(--suave); padding: 4px 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pequenos b { display: block; font-size: 12.5px; color: var(--texto); font-weight: 600; }
  .porque { margin: 0 12px 10px; padding: 7px 10px; border-radius: 9px; font-size: 12px; line-height: 1.4; background: var(--cinza-claro); min-height: 48px; box-sizing: border-box; }
  .vencedor .porque { background: #faf3e2; } .promissor .porque { background: var(--verde-claro); }
  .acoes { display: grid; grid-template-columns: 1.3fr 1fr 1fr 34px; gap: 5px; padding: 0 12px 12px; }
  .acoes a, .acoes button { display: flex; align-items: center; justify-content: center; gap: 5px; height: 34px; padding: 0 8px; border-radius: 9px; min-width: 0;
            border: 1px solid var(--linha); background: var(--cartao); font-size: 12.5px; text-decoration: none; color: var(--texto); cursor: pointer; white-space: nowrap; }
  .acoes a:hover, .acoes button:hover { background: var(--fundo); }
  .acoes .principal { background: var(--ameixa); border-color: var(--ameixa); color: #fff; }
  .acoes .principal:hover { background: var(--ameixa-escuro); }

  .mais { border-top: 1px solid var(--linha-fina); }
  .mais details + details { border-top: 1px solid var(--linha-fina); }
  .mais summary { padding: 9px 12px; font-size: 12.5px; cursor: pointer; list-style: none; }
  .mais summary::-webkit-details-marker { display: none; }
  .mais summary::after { content: "›"; float: right; color: var(--suave); }
  .mais details[open] summary::after { content: "⌄"; }
  .mais p { margin: 0 12px 12px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; color: var(--texto); }
  .mais p.s { color: var(--suave); }

  .vazio { grid-column: 1 / -1; text-align: center; color: var(--suave); padding: 48px 16px; background: var(--cartao); border: 1px dashed var(--linha); border-radius: 16px; }
  .vazio b { display: block; color: var(--texto); font-size: 17px; margin-bottom: 4px; }
  footer { margin: 0 var(--margem); padding: 18px 0 48px; border-top: 1px solid var(--linha); color: var(--suave); font-size: 12.5px; line-height: 1.6; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--texto); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.ver { opacity: 1; }

  .plats .ct { display: none; }
  @media (max-width: 820px) { .plats { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 8px; } .plats button { padding: 10px 4px !important; font-size: 12.5px !important; justify-content: center; white-space: nowrap; min-width: 0; } .plats .lg { display: none; } .plats .ct { display: inline; } }
  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    .hero { margin: 16px 16px 0; padding: 22px 18px; } .hero h1 { font-size: 24px; }
    .so { margin-left: 0; }
    main { grid-template-columns: 1fr; }

  }
  /* três botões, cada um com a cor da sua plataforma */
  .plats { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .plats button { display: flex; align-items: center; gap: 8px; border: 2px solid transparent; color: #fff; font-size: 15px; font-weight: 650;
                  padding: 11px 20px; border-radius: 12px; cursor: pointer; opacity: .7; transition: opacity .15s, transform .15s; }
  .plats button:hover { opacity: .85; }
  .plats button.ativo { opacity: 1; box-shadow: 0 0 0 3px #fff, 0 0 0 5px currentColor; }
  .plats [data-p=meta] { background: #1877f2; } .plats [data-p=meta].ativo { color: #fff; box-shadow: 0 0 0 3px var(--cartao), 0 0 0 5px #1877f2; }
  .plats [data-p=google] { background: #fbbc04; color: #2b2205; } .plats [data-p=google].ativo { box-shadow: 0 0 0 3px var(--cartao), 0 0 0 5px #fbbc04; }
  .plats [data-p=tiktok] { background: #111; } .plats [data-p=tiktok].ativo { box-shadow: 0 0 0 3px var(--cartao), 0 0 0 5px #111; }
  .vazio-plat { margin: 18px var(--margem) 56px; padding: 56px 24px; text-align: center; background: var(--cartao); border: 1px dashed var(--linha); border-radius: 16px; color: var(--suave); }
  .vazio-plat b { display: block; font-size: 19px; color: var(--texto); margin-bottom: 6px; }
  /* topo claro, para os três botões se verem nas suas cores */
  .hero, .hero.meta, .hero.google, .hero.tiktok { background: var(--cartao); color: var(--texto); border: 1px solid var(--linha); box-shadow: none; }
  .hero p { color: var(--suave) !important; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 32px; align-items: center; }
  .hero .chips { display: grid; grid-template-columns: repeat(3, minmax(130px, auto)); gap: 8px; margin: 0; }
  .hero .chips .chip { justify-content: flex-start; padding: 10px 14px; border-radius: 12px; }
  .hero .chips[hidden] { display: none !important; }
  @media (max-width: 1100px) { .hero { grid-template-columns: 1fr; } .hero .chips { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
  .hero .chip { background: var(--fundo); border-color: var(--linha); color: var(--texto); }
  .hero .chips:has(.kpi) { display: grid; grid-template-columns: auto repeat(2, minmax(110px, auto)); gap: 18px 28px; align-items: start; }
  .kpi { display: flex; flex-direction: column; gap: 2px; }
  .kpi small { font-size: 13px; color: #8a8178; }
  .kpi b { font-size: 22px; font-weight: 600; letter-spacing: -.2px; }
  .kpi i { font-style: normal; font-size: 12px; color: #8a8178; }
  .kpi.heroi { grid-row: span 2; padding-right: 28px; border-right: 1px solid var(--linha); }
  .kpi.heroi b { font-size: 48px; line-height: 1.05; letter-spacing: -1px; }
  .kpi.mau i { color: #b23b2e; } .kpi.bom i { color: #2e7d4f; }
  /* o filtro de país do resumo: os números do topo contam só o país escolhido */
  .kfiltro { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .kfiltro .f { padding: 5px 11px; font-size: 13px; }
  /* filtros de datas do resumo (18/11): o mesmo aspeto dos botões de país; no telemóvel partem em duas linhas */
  .kfiltros { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; }
  .kintervalo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--suave); }
  .kintervalo label { display: flex; align-items: center; gap: 6px; }
  .kintervalo input { font: inherit; font-size: 13px; color: var(--texto); background: var(--cartao); border: 1px solid var(--linha);
                      border-radius: 10px; padding: 4px 9px; min-height: 31px; }
  .knums { display: contents; }
  /* a linha do período não alarga o resumo: ocupa só a largura que os números já têm */
  .kperiodo { grid-column: 1 / -1; width: 0; min-width: 100%; margin-top: -6px; font-size: 12.5px; color: var(--suave); text-wrap: pretty; }
  /* no telemóvel o resumo saía para fora do ecrã: o gasto fica numa linha e os outros 4 números em 2 colunas */
  @media (max-width: 640px) {
    .hero .chips:has(.kpi) { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
    .kpi.heroi { grid-column: 1 / -1; grid-row: auto; padding: 0 0 14px; border-right: 0; border-bottom: 1px solid var(--linha); }
    .kintervalo input { font-size: 16px; } /* abaixo de 16 px o iPhone faz zoom ao tocar */
  }
</style>
</head>
<body>
<header class="hero"><div class="esq">
  <div class="plats" id="plats">
    <button data-p="meta">📘 <span class="lg">Facebook Meta Ads</span><span class="ct">Meta</span></button><button data-p="google">🔎 <span class="lg">Google Ads</span><span class="ct">Google</span></button><button data-p="tiktok">🎵 <span class="lg">TikTok Ads</span><span class="ct">TikTok</span></button>
  </div>
  <h1 id="titulo">📣 Anúncios ativos ForYouSong</h1>
  <p id="desc">Os anúncios que temos a correr no Facebook e como está a correr cada um. Quando um passa a vencedor, fica pronto para meter no Google e no TikTok Shop, com o vídeo e o texto prontos a levar.</p>
  </div><div class="chips" id="chips"></div>
</header>

<section class="vazio-plat" id="vazio-plat" hidden></section>

<section class="campanhas" id="campanhas"></section>
<div class="filtros">
  <span class="rotulo">Estado</span><div class="grupo" id="f-veredito"></div>
  <span class="rotulo">Mercado</span><div class="grupo" id="f-mercado"></div>
  <label class="so"><input type="checkbox" id="so-ligados"> Só os que estão a correr</label>
</div>
<div class="aviso" id="aviso" hidden></div>
<main id="lista"></main>
<footer id="rodape"></footer>
<div class="toast" id="toast"></div>

<script>document.write('<script src="dados-vencedores-fys.js?' + Date.now() + '"><\/script>');</script>
<script>
  const D = window.VENCEDORES_FYS || { itens: [], lido: "-" };
  // Cartões das campanhas por país: os números seguem o período escolhido no resumo do topo
  function desenhaCampanhas(C) {
    const el = document.getElementById("campanhas");
    if (!el) return;
    const m = (v) => v.toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " $";
    const PAISES = { IT: ["🇮🇹", "Itália"], DE: ["🇩🇪", "Alemanha"], GB: ["🇬🇧", "Reino Unido"], FR: ["🇫🇷", "França"], ES: ["🇪🇸", "Espanha"], US: ["🇺🇸", "Estados Unidos"], PT: ["🇵🇹", "Portugal"] };
    el.innerHTML = C.map((c) => {
      const cod = (/\[([A-Z]{2})\]/.exec(c.nome) || [])[1] || "";
      const [band, pais] = PAISES[cod] || ["", c.nome];
      const resto = c.nome.replace(/^.*?\[[A-Z]{2}\]\s*-\s*/, "").split(/\s*[-|]\s*/).map((x) => x.replace(/[\[\]]/g, "")).filter(Boolean);
      const cpm = c.impressoes ? (c.gasto / c.impressoes) * 1000 : 0;
      return `<div class="camp" data-camp="${cod}" title="Mostrar só os anúncios deste país">
        <div class="cab"><span>${band}</span><b>${pais}</b><small class="${c.ligada ? "" : "off"}">${c.ligada ? "● Ligada" : "Desligada"}</small></div>
        <div class="tipo">${resto.map((x) => x.replace(/</g, "&lt;")).join(" · ")}</div>
        <div class="gasto"><b>${m(c.gasto)}</b><span>gasto · ${m(c.orcamento)}/dia</span></div>
        <div class="rodape"><span><b class="${c.compras ? "bom" : ""}">${c.compras}</b> ${c.compras === 1 ? "compra" : "compras"}</span><span><b>${c.impressoes.toLocaleString("pt-PT")}</b> impressões</span><span>CPM <b>${cpm ? m(cpm) : "-"}</b></span></div>
      </div>`;
    }).join("");
  }
  document.getElementById("campanhas").addEventListener("click", (e) => {
    const c = e.target.closest("[data-camp]");
    if (!c || !c.dataset.camp) return;
    est.m = est.m === c.dataset.camp ? "todos" : c.dataset.camp;
    guarda(); desenha(); marcaCamp();
  });
  const WEB = !!window.VENCEDORES_WEB; // no link partilhado os vídeos estão em videos/<código>.mp4
  const nf = (x, c = 0) => x == null ? "-" : new Intl.NumberFormat("pt-PT", { minimumFractionDigits: c, maximumFractionDigits: c }).format(x);
  const eur = (x, c = 2) => x == null ? "-" : nf(x, c) + " " + (D.moeda || "€");
  const pct = (x) => x == null ? "-" : nf(x, 1) + "%";
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const VER = {
    vencedor: { emo: "🏆", nome: "Vencedor" }, promissor: { emo: "🌱", nome: "Promissor" },
    teste: { emo: "⏳", nome: "Em teste" }, fraco: { emo: "❌", nome: "Não copiar" }, fora: { emo: "🚫", nome: "Rejeitado" },
  };
  const est = { v: "todos", m: "todos", so: true, p: "tudo", de: "", ate: "" };
  try { Object.assign(est, JSON.parse(localStorage.getItem("anuncios-fys") || "{}")); } catch (e) {}
  const guarda = () => { try { localStorage.setItem("anuncios-fys", JSON.stringify(est)); } catch (e) {} };

  // Filtros de datas (18/11, pedido do Edu: «aqui eu quero que metas filtros de datas»). Cada anúncio e cada campanha
  // trazem os números dia a dia, no dia da conta como a Meta os dá (igual ao Gestor de Anúncios, sem mudar fuso nem moeda).
  // «Desde o início» usa os totais da Meta, tal como antes. Sem números por dia (ficheiro antigo) os filtros escondem-se.
  const CFG_DATAS = {
    ultimos_com_hoje: false, // «7 dias» e «30 dias» como no Gestor de Anúncios: os dias completos antes de hoje
    padrao: "tudo",
    sem_dados: "Sem gasto nem impressões neste período.",
  };
  const PERIODOS = [["hoje", "Hoje"], ["ontem", "Ontem"], ["7", "7 dias"], ["30", "30 dias"], ["mes", "Este mês"], ["tudo", "Desde o início"], ["datas", "Datas…"]];
  const NOME_PERIODO = { hoje: "Hoje", ontem: "Ontem", 7: CFG_DATAS.ultimos_com_hoje ? "Últimos 7 dias" : "Últimos 7 dias, sem hoje",
    30: CFG_DATAS.ultimos_com_hoje ? "Últimos 30 dias" : "Últimos 30 dias, sem hoje", mes: "Este mês", datas: "" };
  const COM_DIAS = [...D.itens, ...(D.campanhas || [])];

  const PRIMEIRO = DIAS_COM_DADOS[0] || D.hoje || "", ULTIMO = DIAS_COM_DADOS[DIAS_COM_DADOS.length - 1] || D.hoje || "";

  if (!PERIODOS.some(([k]) => k === est.p)) est.p = CFG_DATAS.padrao;
  const diaMais = (s, n) => { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const dpt = (s) => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "";
  const prende = (s) => s < PRIMEIRO ? PRIMEIRO : s > ULTIMO ? ULTIMO : s;
  // [de, até] em «AAAA-MM-DD» (os dois contam), ou null para «Desde o início»
  function intervalo() {
    if (!TEM_DIAS) return null;
    const h = D.hoje, fim = CFG_DATAS.ultimos_com_hoje ? h : diaMais(h, -1), ultimos = (n) => [diaMais(fim, 1 - n), fim];
    switch (est.p) {
      case "hoje": return [h, h];
      case "ontem": return [diaMais(h, -1), diaMais(h, -1)];
      case "7": return ultimos(7);
      case "30": return ultimos(30);
      case "mes": return [h.slice(0, 8) + "01", h];
      case "datas": { const a = prende(est.de || PRIMEIRO), b = prende(est.ate || ULTIMO); return a <= b ? [a, b] : [b, a]; }

    }
  }
  function textoPeriodo(iv) {
    if (!iv) return `Desde o início, ${dpt(PRIMEIRO)} a ${dpt(ULTIMO)} · totais da Meta, dia da conta, igual ao Gestor de Anúncios`;
    const nome = NOME_PERIODO[est.p], datas = iv[0] === iv[1] ? dpt(iv[0]) : `${dpt(iv[0])} a ${dpt(iv[1])}`;

  const r2 = (x) => Math.round(x * 100) / 100, r1 = (x) => Math.round(x * 10) / 10;
  function somaDias(dias, iv) {
    const t = Object.keys(IX).map(() => 0);
    for (const d in dias || {}) if (d >= iv[0] && d <= iv[1]) dias[d].forEach((x, k) => { t[k] += x || 0; });
    return (k) => t[IX[k]];
  }
  // As métricas de cada anúncio no período, calculadas a partir das somas (as mesmas contas de vencedores_fys.py)
  function anuncioNoPeriodo(f, iv) {
    if (!iv) return f;
    const x = somaDias(f.dias, iv);
    const g = x("gasto"), c = x("compras"), v = x("valor"), imp = x("impressoes"), cl = x("cliques"), v3 = x("vistas3s");
    const p = Object.assign({}, f, {
      gasto: r2(g), compras: c, valor: r2(v), roas: g ? r2(v / g) : 0, cpa: c ? r2(g / c) : null,
      imp, cpm: imp ? r2(g / imp * 1000) : null, ctr: imp && cl ? r2(cl / imp * 100) : null,
      hook: imp ? r1(v3 / imp * 100) : null, hold: v3 ? r1(x("thruplays") / v3 * 100) : null,
      visitas: x("visitas"), carrinhos: x("carrinhos"), vazio: !g && !imp,
    });

  function campanhaNoPeriodo(c, iv) {
    if (!iv) return c;
    const x = somaDias(c.dias, iv);
    return Object.assign({}, c, { gasto: r2(x("gasto")), compras: x("compras"), vendas: r2(x("valor")), impressoes: x("impressoes"),

  }
  // veredito() de vencedores_fys.py, com os mesmos limiares (vêm nos dados em D.regras)
  const REGRAS = Object.assign({ vencedor_compras: 3, vencedor_roas: 2.0, promissor_roas: 1.2, paga_roas: 1.0, teste_gasto: 20.0, sinal_hook: 20.0, sinal_carrinho: 1 }, D.regras || {});
  // como o f"{x:.0f}" do Python: um empate exato (28,5) arredonda para o par (28)
  const eu2 = (x) => x.toFixed(2).replace(".", ","), f0 = (x) => { let n = Math.round(x); if (n - x === 0.5 && n % 2) n -= 1; return String(n); };
  function veredito(f) {

    if (f.compras >= 1 && f.compras < r.vencedor_compras && f.roas >= r.paga_roas)
      return ["teste", `${f0(f.compras)} compra(s) com ROAS ${eu2(f.roas)}: já se paga, faltam mais vendas para decidir.`];
    if (f.gasto < r.teste_gasto && f.compras === 0) {
      const sinais = [];
      if (f.hook != null && f.hook >= r.sinal_hook) sinais.push(`gancho forte (${f0(f.hook)}%)`);
      if (f.carrinhos >= r.sinal_carrinho) sinais.push(`${f0(f.carrinhos)} carrinho(s)`);
      return ["teste", `Só ${eu2(f.gasto)} ${f.moeda} gastos, ainda é cedo.` + (sinais.length ? ` Já mostra ${sinais.join(" e ")}.` : "")];
    }
    if (f.compras === 0) return ["fraco", `${eu2(f.gasto)} ${f.moeda} sem nenhuma compra: não copiar.`];
    if (f.roas >= r.paga_roas) return ["fraco", `${f0(f.compras)} compras com ROAS ${eu2(f.roas)}: mal se paga, não chega para copiar.`];

  }
  // A ordem do fim do main() de vencedores_fys.py: vencedores no topo, desligados e rejeitados no fim; no meio quem vende
  // vai à frente (compras, depois ROAS); sem vendas, o veredito e os sinais antes da venda. Sem números no período: no fim.
  const ORDEM = { vencedor: 0, promissor: 1, teste: 2, fraco: 3, fora: 4 }, GRUPO = { vencedor: 0, fora: 2 };
  const chave = (f) => [f.vazio ? 1 : 0, GRUPO[f.veredito] ?? 1, f.ligado ? 0 : 1, -(f.compras || 0), -(f.roas || 0),
    ORDEM[f.veredito], -(f.carrinhos || 0), -(f.visitas || 0), -(f.hook || 0)];
  function ordena(L) {
    return L.map((f, i) => [chave(f), i, f]).sort((a, b) => {
      for (let k = 0; k < a[0].length; k++) if (a[0][k] !== b[0][k]) return a[0][k] - b[0][k];

  let IV = null, P = D.itens, PC = D.campanhas || []; // período escolhido, anúncios e campanhas com os números desse período

  const video = (f) => (!f.video_local && f.video_url) ? f.video_url : WEB ? `videos/${encodeURIComponent(f.codigo)}.mp4` : encodeURI(f.video_local);
  const data = (s) => s && s.length >= 10 ? s.slice(8, 10) + "/" + s.slice(5, 7) + " às " + s.slice(11, 16) : s;

  // Resumo do topo (18/11, pedido do Edu: «estes valores estão a contar com outros»): conta só o país escolhido,
  // no filtro do próprio resumo, no «Mercado» ou nos cartões das campanhas (os três mudam juntos).
  const codCamp = (c) => (/\[([A-Z]{2})\]/.exec(c.nome) || [])[1] || "";
  const soma = (L, k) => L.reduce((a, x) => a + (x[k] || 0), 0);
  // Monta uma vez o esqueleto do resumo; os campos de data não se refazem a cada mudança (perdiam o foco ao escrever).
  function montaResumo() {

    el.innerHTML = `<div class="kfiltros"><div class="kfiltro" id="kpais"></div>` +
      `<div class="kfiltro" id="kdatas"${TEM_DIAS ? "" : " hidden"}></div>` +
      `<div class="kintervalo" id="kintervalo" hidden><label>De <input type="date" id="kde"></label><label>Até <input type="date" id="kate"></label></div></div>` +
      `<div class="knums" id="knums"></div><div class="kperiodo" id="kperiodo"${TEM_DIAS ? "" : " hidden"}></div>`;
    const de = document.getElementById("kde"), ate = document.getElementById("kate");
    for (const i of [de, ate]) { i.min = PRIMEIRO; i.max = ULTIMO; }
    const muda = () => {
      if (!de.value || !ate.value) return;
      [est.de, est.ate] = [prende(de.value), prende(ate.value)].sort();
      guarda(); desenha();
    };

    // Ao sair do campo, os dois mostram o período que conta (datas trocadas ou fora dos dias com números ficam acertadas)
    const acerta = () => { if (est.p === "datas" && IV) { de.value = IV[0]; ate.value = IV[1]; } };
    de.onblur = acerta; ate.onblur = acerta;
  }
  function resumo() {
    montaResumo();
    const doPais = (cod) => est.m === "todos" || cod === est.m;
    const I = P.filter((f) => doPais(f.mercado));

      .map(([k, n]) => `<button class="f ${est.m === k ? "ativo" : ""}" data-km="${k}">${n}</button>`).join("");

    `Números do Gestor de Anúncios da Meta (conta ${esc(D.conta_nome || "Holy Song LLC")}), ${IV ? "de " + (IV[0] === IV[1] ? dpt(IV[0]) : dpt(IV[0]) + " a " + dpt(IV[1])) + " (dia da conta)" : "desde que cada anúncio foi criado"}, lidos a ${data(D.lido)}. ` +

  function cartao(f) {

  function desenha() {

    const so = IV && !(IV[0] <= PRIMEIRO && IV[1] >= ULTIMO) ? IV : null;

    const I = P.filter((f) => (!est.so || f.ligado) && (est.m === "todos" || f.mercado === est.m) &&

      : `<div class="vazio"><b>Nada aqui por agora</b>${est.v === "vencedor" ? "Quando um anúncio tiver 3 compras com ROAS de 2 ou mais, aparece aqui." : "Experimenta outro filtro."}</div>`;
    document.querySelectorAll("video[data-src]").forEach((v) => {

  }
  function copia(t, msg) {
    const fim = () => { const e = document.getElementById("toast"); e.textContent = msg; e.classList.add("ver"); setTimeout(() => e.classList.remove("ver"), 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(fim, () => velho(t, fim)); else velho(t, fim);
  }
  function velho(t, fim) { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); fim(); }
  // três plataformas: só a Meta tem números ligados por agora
  const PLAT = {
    meta: { t: "📘 Facebook Meta Ads", d: "Os anúncios que temos a correr no Facebook e Instagram e como está a correr cada um. Quando um passa a vencedor, fica pronto para meter no Google e no TikTok, com o vídeo e o texto prontos a levar." },
    google: { t: "🔎 Google Ads", d: "Os anúncios que a equipa do Google tem a correr." },
    tiktok: { t: "🎵 TikTok Ads", d: "Os anúncios que a equipa do TikTok tem a correr." },
  };
  let plat = "meta";
  try { plat = localStorage.getItem("anuncios-fys-plat") || "meta"; } catch (e) {}
  function mostraPlat() {
    if (!PLAT[plat]) plat = "meta";
    document.querySelectorAll("#plats button").forEach((b) => b.classList.toggle("ativo", b.dataset.p === plat));
    document.querySelector(".hero").className = "hero " + plat;
    document.getElementById("titulo").textContent = PLAT[plat].t;
    document.getElementById("desc").textContent = PLAT[plat].d;
    const meta = plat === "meta";
    for (const sel of ["#chips", ".filtros", "#lista", "#rodape"]) document.querySelector(sel).hidden = !meta;
    document.getElementById("aviso").hidden = !meta || P.some((f) => f.veredito === "vencedor");
    const v = document.getElementById("vazio-plat");
    v.hidden = meta;
    v.innerHTML = `<b>${PLAT[plat].t}: ainda sem números</b>Esta parte ainda não está ligada à conta. Quando estiver, os anúncios aparecem aqui como os da Meta.`;
  }
  document.querySelectorAll("#plats button").forEach((b) => b.onclick = () => { plat = b.dataset.p; try { localStorage.setItem("anuncios-fys-plat", plat); } catch (e) {} mostraPlat(); });
  document.getElementById("so-ligados").onchange = (e) => { est.so = e.target.checked; guarda(); desenha(); };
  desenha();
  mostraPlat();
  function marcaCamp() { document.querySelectorAll("[data-camp]").forEach((c) => c.classList.toggle("ativa", c.dataset.camp === est.m)); }
  marcaCamp();
</script>
</body>
